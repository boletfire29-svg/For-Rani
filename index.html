<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rani ❤️ - A Special Message</title>
    <!-- Tailwind CSS for responsive layout and utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Great Vibes for romantic calligraphy, Poppins for clean UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Custom romantic animations and styling */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b091c 0%, #14030d 55%, #070104 100%);
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Full-screen interactive particle & heart canvas */
        #magicCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Romantic Calligraphy Font */
        .font-romantic {
            font-family: 'Great Vibes', cursive;
        }

        /* Pulsing Love Wave Rings during the 10-second buildup */
        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(255, 77, 136, 0.5);
            box-shadow: 0 0 25px rgba(255, 42, 109, 0.4), inset 0 0 25px rgba(255, 42, 109, 0.3);
            animation: expandWave 3s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 1s;
        }

        .pulse-ring:nth-child(3) {
            animation-delay: 2s;
        }

        @keyframes expandWave {
            0% {
                width: 60px;
                height: 60px;
                opacity: 0.9;
            }
            100% {
                width: 480px;
                height: 480px;
                opacity: 0;
            }
        }

        /* Beating Center Heart in Intro */
        .beating-heart {
            animation: heartBeat 1.1s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(255, 42, 109, 0.85));
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1.05); }
            45% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        /* Glowing Text Effect for Final Reveal */
        .glow-text {
            background: linear-gradient(135deg, #ffffff 0%, #ffb3c6 45%, #ff4d88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 77, 136, 0.75)) drop-shadow(0 0 45px rgba(255, 20, 100, 0.5));
            animation: floatText 4s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Smooth Reveal Transition */
        .reveal-scale {
            animation: grandReveal 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes grandReveal {
            0% {
                opacity: 0;
                transform: scale(0.6) translateY(30px);
                filter: blur(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        /* Progress Bar Glow */
        .progress-glow {
            box-shadow: 0 0 15px #ff2a6d, 0 0 30px #ff758f;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative text-white cursor-pointer">

    <!-- Background Canvas for Floating Hearts, Sparkles & Click Burst -->
    <canvas id="magicCanvas"></canvas>

    <!-- PHASE 1: First 10 Seconds Magical Buildup -->
    <div id="introSection" class="relative z-10 flex flex-col items-center justify-center text-center px-6 transition-all duration-1000 ease-in-out">
        <!-- Expanding Love Waves -->
        <div class="relative w-40 h-40 flex items-center justify-center mb-6">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            
            <!-- Glowing SVG Heart -->
            <svg class="w-20 h-20 sm:w-24 sm:h-24 text-pink-500 beating-heart relative z-10" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Dynamic Romantic Teaser Text -->
        <p id="teaserText" class="text-lg sm:text-2xl font-light tracking-widest text-pink-200 mb-4 transition-opacity duration-500">
            Preparing something magical for you...
        </p>

        <!-- 10-Second Countdown & Magic Progress Bar -->
        <div class="w-64 sm:w-80 bg-white/10 rounded-full h-2 overflow-hidden backdrop-blur-sm border border-pink-500/30 mb-3">
            <div id="progressBar" class="bg-gradient-to-r from-pink-500 via-rose-500 to-amber-300 h-full w-0 rounded-full progress-glow transition-all duration-100 ease-linear"></div>
        </div>
        
        <span id="countdownNumber" class="text-xs sm:text-sm tracking-[0.25em] uppercase text-pink-300/80 font-medium">
            10s
        </span>
    </div>

    <!-- PHASE 2: Grand Reveal After 10 Seconds -->
    <div id="revealSection" class="hidden relative z-10 flex-col items-center justify-center text-center px-4 max-w-4xl mx-auto">
        <!-- Decorative Top Sparkle Icon -->
        <div class="mb-2 sm:mb-4 text-pink-300 animate-pulse">
            <svg class="w-8 h-8 sm:w-10 sm:h-10 mx-auto" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
            </svg>
        </div>

        <!-- Main Proposal Headline -->
        <h1 class="font-romantic text-6xl sm:text-8xl md:text-9xl leading-tight glow-text py-2 px-4">
            I Love You Rani
        </h1>

        <!-- Heart Divider -->
        <div class="flex items-center justify-center gap-3 my-4 sm:my-6">
            <span class="h-[1px] w-12 sm:w-24 bg-gradient-to-r from-transparent to-pink-400"></span>
            <svg class="w-6 h-6 text-rose-500 beating-heart" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="h-[1px] w-12 sm:w-24 bg-gradient-to-l from-transparent to-pink-400"></span>
        </div>

        <!-- Sweet Sub-message -->
        <p class="text-base sm:text-xl md:text-2xl text-pink-100/90 font-light tracking-wide max-w-xl mx-auto leading-relaxed">
            You are the brightest star in my universe and the heartbeat of my soul. Forever & always.
        </p>

        <!-- Interactive Hint -->
        <p class="mt-8 text-xs sm:text-sm text-pink-300/60 tracking-widest uppercase animate-bounce">
            Tap anywhere to shower love ✨
        </p>
    </div>

    <script>
        /**
         * Interactive Canvas Particle & Heart System + 10-Second Proposal Timer
         */
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let isRevealed = false;

        // Resize canvas responsively
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Color palette for hearts and sparkles
        const colors = [
            '#ff2a6d', // Vibrant Rose
            '#ff758f', // Soft Pink
            '#ffb3c6', // Pastel Blush
            '#ffd166', // Warm Gold Sparkle
            '#ffffff', // Pure Starlight
            '#c9184a'  // Deep Crimson
        ];

        // Particle class supporting both Sparkles and Glowing Hearts
        class LoveParticle {
            constructor(x, y, isBurst = false) {
                this.x = x !== undefined ? x : Math.random() * width;
                this.y = y !== undefined ? y : height + 20;
                this.isBurst = isBurst;
                this.type = Math.random() > 0.35 ? 'heart' : 'sparkle';
                
                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 1.5;
                    this.size = Math.random() * 14 + 8;
                    this.decay = Math.random() * 0.015 + 0.01;
                } else {
                    this.vx = (Math.random() - 0.5) * 1.2;
                    this.vy = -(Math.random() * 1.8 + 0.7);
                    this.size = this.type === 'heart' ? (Math.random() * 14 + 8) : (Math.random() * 3 + 1.5);
                    this.decay = 0.002;
                }

                this.alpha = Math.random() * 0.6 + 0.4;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.04 + 0.01;
            }

            update() {
                this.wobble += this.wobbleSpeed;
                if (this.isBurst) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.08; // Gentle gravity on burst
                    this.alpha -= this.decay;
                } else {
                    this.x += this.vx + Math.sin(this.wobble) * 0.6;
                    this.y += this.vy;
                    if (this.y < -30) {
                        this.y = height + 20;
                        this.x = Math.random() * width;
                    }
                }
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x, this.y);

                if (this.type === 'heart') {
                    // Draw smooth vector heart
                    const s = this.size / 15;
                    ctx.scale(s, s);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 12;

                    ctx.beginPath();
                    ctx.moveTo(0, 4);
                    ctx.bezierCurveTo(0, 0, -8, -4, -8, 2);
                    ctx.bezierCurveTo(-8, 8, 0, 12, 0, 15);
                    ctx.bezierCurveTo(0, 12, 8, 8, 8, 2);
                    ctx.bezierCurveTo(8, -4, 0, 0, 0, 4);
                    ctx.fill();
                } else {
                    // Draw glowing sparkle star
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Initialize ambient floating particles
        function initParticles() {
            const count = window.innerWidth < 640 ? 45 : 75;
            for (let i = 0; i < count; i++) {
                const p = new LoveParticle(Math.random() * width, Math.random() * height, false);
                particles.push(p);
            }
        }

        // Spawn burst of hearts on click/tap or reveal
        function createHeartBurst(x, y, amount = 22) {
            for (let i = 0; i < amount; i++) {
                particles.push(new LoveParticle(x, y, true));
            }
        }

        // Main animation loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.isBurst && p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        // 10-Second Romantic Buildup Controller
        function startProposalSequence() {
            const introSection = document.getElementById('introSection');
            const revealSection = document.getElementById('revealSection');
            const progressBar = document.getElementById('progressBar');
            const countdownNumber = document.getElementById('countdownNumber');
            const teaserText = document.getElementById('teaserText');

            const messages = [
                "Close your eyes for a moment...",
                "Every heartbeat whispers a name...",
                "A special magic is unfolding...",
                "Just for you, my love..."
            ];

            const totalDuration = 10000; // 10 seconds
            const startTime = Date.now();

            const timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / totalDuration) * 100, 100);
                const remaining = Math.max(Math.ceil((totalDuration - elapsed) / 1000), 0);

                // Update progress bar & timer text
                progressBar.style.width = `${progress}%`;
                countdownNumber.textContent = remaining > 0 ? `${remaining}s` : '❤️';

                // Cycle romantic teaser phrases every 2.5 seconds
                const msgIndex = Math.min(Math.floor(elapsed / 2500), messages.length - 1);
                if (teaserText.textContent !== messages[msgIndex]) {
                    teaserText.style.opacity = 0;
                    setTimeout(() => {
                        teaserText.textContent = messages[msgIndex];
                        teaserText.style.opacity = 1;
                    }, 200);
                }

                // Trigger Grand Reveal at 10 seconds
                if (elapsed >= totalDuration && !isRevealed) {
                    isRevealed = true;
                    clearInterval(timerInterval);

                    // Fade out intro
                    introSection.style.opacity = '0';
                    introSection.style.transform = 'scale(0.85)';

                    setTimeout(() => {
                        introSection.classList.add('hidden');
                        revealSection.classList.remove('hidden');
                        revealSection.classList.add('flex', 'reveal-scale');

                        // Celebratory heart explosion in the center
                        createHeartBurst(width / 2, height / 2, 65);
                        setTimeout(() => createHeartBurst(width * 0.3, height * 0.4, 30), 300);
                        setTimeout(() => createHeartBurst(width * 0.7, height * 0.4, 30), 500);
                    }, 700);
                }
            }, 50);
        }

        // Interactive click/tap heart shower anywhere on screen
        document.body.addEventListener('pointerdown', (e) => {
            createHeartBurst(e.clientX, e.clientY, 18);
        });

        // Start everything on page load
        window.onload = function () {
            initParticles();
            animate();
            startProposalSequence();
        };
    </script>
</body>
</html>
